name: ${INSTANCE:-hometab}

# Più istanze sullo stesso host (es. la vetrina demo e una con dati reali): ognuna è uno stack
# separato con una propria INSTANCE, che dà il nome a container e router di Traefik. Volumi e
# rete interna sono già separati dal nome del progetto (lo stack). Default "hometab".
#
# Le immagini arrivano già pronte da GHCR (le pubblica la CI a ogni push su main):
# HOMETAB_IMAGE_TAG sceglie la versione, "main" (default) oppure lo SHA completo di un commit.
# Per costruirle dai sorgenti: docker compose -f docker-compose.yml -f compose.build.yml up -d --build

services:
  mongodb:
    # mongo:7 con lo script di init incluso (deploy/mongo/Dockerfile): niente bind mount relativi,
    # che gli stack Git di Portainer CE non montano.
    image: ghcr.io/federicoscimone/hometab-mongodb:${HOMETAB_IMAGE_TAG:-main}
    container_name: ${INSTANCE:-hometab}-mongodb
    restart: unless-stopped
    command: ["--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "echo 'db.runCommand({ ping: 1 }).ok' | mongosh mongodb://$${MONGO_INITDB_ROOT_USERNAME}:$${MONGO_INITDB_ROOT_PASSWORD}@localhost:27017/admin --quiet | grep 1",
        ]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - internal

  app:
    image: ghcr.io/federicoscimone/hometab-app:${HOMETAB_IMAGE_TAG:-main}
    container_name: ${INSTANCE:-hometab}-app
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=${MONGO_DATABASE}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      APP_URL: ${NEXTAUTH_URL}
      DEMO_MODE: ${DEMO_MODE}
      LOG_LEVEL: ${LOG_LEVEL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_DRIVE_TOKEN_SECRET: ${GOOGLE_DRIVE_TOKEN_SECRET:-}
      BACKUP_CRON_SECRET: ${BACKUP_CRON_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      AI_MODEL_IMPORT: ${AI_MODEL_IMPORT:-}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-}
      AI_MONTHLY_BUDGET_USD: ${AI_MONTHLY_BUDGET_USD:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-}
    # Da dentro il container 127.0.0.1 è il container stesso: un Ollama installato sul computer
    # che ospita Docker si raggiunge come http://host.docker.internal:11434.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Porta sull'host. Dietro un reverse proxy conviene legarla a 127.0.0.1 (APP_BIND), così
    # l'app non è raggiungibile in rete aggirando il proxy.
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok||r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks:
      - internal
      - public
    # Etichette per Traefik: senza Traefik sono inerti. Spente di default (TRAEFIK_ENABLE).
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-false}"
      - "traefik.docker.network=${PUBLIC_NETWORK:-hometab_public}"
      - "traefik.http.routers.${INSTANCE:-hometab}.rule=Host(`${APP_HOST:-localhost}`)"
      # Solo HTTPS: la porta 80 di Traefik fa già il redirect verso websecure.
      - "traefik.http.routers.${INSTANCE:-hometab}.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.services.${INSTANCE:-hometab}.loadbalancer.server.port=3000"

  # Bot Telegram in polling: riceve i messaggi e li consegna all'app (vedi workers/telegram.js). Stessa immagine
  # dell'app, altro comando. Parte solo con il profilo "telegram" (COMPOSE_PROFILES=telegram),
  # così chi clona il progetto non deve configurare un bot. Una sola istanza per bot.
  telegram:
    image: ghcr.io/federicoscimone/hometab-app:${HOMETAB_IMAGE_TAG:-main}
    container_name: ${INSTANCE:-hometab}-telegram
    profiles: ["telegram"]
    restart: unless-stopped
    command: ["node", "workers/telegram.js"]
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=${MONGO_DATABASE}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      # Gli update vanno all'app, che risponde: il token di consegna si ricava da questo segreto.
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      TELEGRAM_RELAY_URL: http://app:3000
    networks:
      - internal

  # Reset notturno della vetrina (DEMO_MODE=true) su un server proprio: su Vercel lo fa vercel.json.
  # Stessa immagine dell'app, altro comando (workers/demo-reset.js). Parte solo con il profilo
  # "demo" (COMPOSE_PROFILES=demo) e richiede CRON_SECRET. Ora in UTC: DEMO_RESET_HOUR_UTC (default 3).
  demo-reset:
    image: ghcr.io/federicoscimone/hometab-app:${HOMETAB_IMAGE_TAG:-main}
    container_name: ${INSTANCE:-hometab}-demo-reset
    profiles: ["demo"]
    restart: unless-stopped
    command: ["node", "workers/demo-reset.js"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      DEMO_RESET_URL: http://app:3000/api/demo/reset
      DEMO_RESET_HOUR_UTC: ${DEMO_RESET_HOUR_UTC:-3}
    networks:
      - internal

volumes:
  mongo_data:

networks:
  internal:
  # Rete da cui l'app è raggiungibile. Di default compose la crea per il progetto. Dietro un
  # reverse proxy che vive su una rete già esistente (es. Traefik sulla rete "edge") si
  # impostano PUBLIC_NETWORK=edge e PUBLIC_NETWORK_EXTERNAL=true: stesso file per tutti, la
  # differenza fra ambienti sta solo nelle variabili.
  public:
    name: ${PUBLIC_NETWORK:-hometab_public}
    external: ${PUBLIC_NETWORK_EXTERNAL:-false}
