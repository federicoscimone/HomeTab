name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Same placeholders as the Dockerfile builder stage: the build imports the routes but
      # never connects to a database (see BUILD_TARGET in next.config.mjs and app/layout.js).
      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: container
          MONGODB_URI: mongodb://build:build@localhost:27017/build
          NEXTAUTH_SECRET: build-time-placeholder-secret

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag hometab:ci .
      - run: docker build --tag hometab-mongodb:ci deploy/mongo

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Images on GHCR, so a server pulls them instead of building them (Portainer cannot build
  # through its agent). Only on main, and only after every check above has passed.
  publish:
    name: Publish ${{ matrix.image }}
    needs: [check, docker, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two quick pushes: the newer run cancels the older one, so "main" never goes back in time.
    concurrency:
      group: publish-${{ matrix.image }}
      cancel-in-progress: true
    strategy:
      matrix:
        include:
          - image: hometab-app
            context: .
          - image: hometab-mongodb
            context: deploy/mongo
    steps:
      - uses: actions/checkout@v7
      # arm64 too, for the Raspberry Pi 5 (docs/self-hosting.md).
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tags: "main" (latest build of the branch) and the full commit SHA (a fixed version).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
