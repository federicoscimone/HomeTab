name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Same placeholders as the Dockerfile builder stage: the build imports the routes but
      # never connects to a database (see BUILD_TARGET in next.config.mjs and app/layout.js).
      - name: Build
        run: npm run build
        env:
          BUILD_TARGET: container
          MONGODB_URI: mongodb://build:build@localhost:27017/build
          NEXTAUTH_SECRET: build-time-placeholder-secret

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag hometab:ci .
      - run: docker build --tag hometab-mongodb:ci deploy/mongo

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, not only the last commit
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner

  # Images on GHCR, so a server pulls them instead of building them (Portainer cannot build
  # through its agent). Only on main, and only after every check above has passed.
  # amd64 and arm64 (the Raspberry Pi 5, docs/self-hosting.md) are built in parallel, each on a
  # native runner: no QEMU emulation, which made the arm64 build of the app several times slower.
  # Each build is pushed by digest only; the "manifest" job then tags both as one image.
  publish:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [check, docker, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    # Two quick pushes: the newer run cancels the older one, so "main" never goes back in time.
    concurrency:
      group: publish-${{ matrix.image }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      matrix:
        image: [hometab-app, hometab-mongodb]
        arch: [amd64, arm64]
        include:
          - image: hometab-app
            context: .
          - image: hometab-mongodb
            context: deploy/mongo
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # free on public repositories
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Version of the build, as the app shows it (lib/buildInfo.js): package.json's version with
      # the short commit SHA as build metadata, e.g. 1.4.2+059b385.
      - id: version
        run: echo "version=$(jq -r .version package.json)+${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # Read at runtime by the app (Dockerfile, runner stage); the Mongo image ignores them.
          build-args: |
            BUILD_SHA=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}
      - name: Save the digest for the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One multi-arch image from the two builds, tagged "main" (latest build of the branch) and with
  # the full commit SHA (a fixed version). Only when both architectures of the image are pushed.
  manifest:
    name: Publish ${{ matrix.image }}
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: manifest-${{ matrix.image }}
      cancel-in-progress: true
    strategy:
      matrix:
        image: [hometab-app, hometab-mongodb]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main
            type=sha,format=long,prefix=
      - name: Create and push the multi-arch tags
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          test "$(ls | wc -l)" -eq 2 # one digest per architecture
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Check both architectures
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          docker buildx imagetools inspect --raw "$IMAGE" |
            jq -e '[.manifests[].platform.architecture] | (index("amd64") and index("arm64"))'

  # Local production follows the "deploy" branch (Portainer polls it): a release is written there
  # only after both images of this commit are on GHCR, so a redeploy never pulls a missing tag.
  # One plain commit per release, never a force push (see deploy/release-lab-int.sh).
  release:
    name: Release to lab-int
    needs: [manifest]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that can push, and only to "deploy" through the script
    # Releases one at a time, never cancelled halfway; the script also refuses to go back in time.
    concurrency:
      group: release-lab-int
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history, to tell whether this commit is newer than the release
      - name: Write the release on the deploy branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: deploy/release-lab-int.sh "$GITHUB_SHA"
