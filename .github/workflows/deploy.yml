name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy su Raspberry Pi
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build immagine Docker
        run: docker build -t hometab:latest .

      - name: Restart container
        working-directory: /home/federico/hometab
        run: |
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          sleep 15
          curl -sf http://localhost:3000 || (echo "Health check fallito" && exit 1)
