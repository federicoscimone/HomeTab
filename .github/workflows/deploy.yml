name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # consente avvio manuale dalla UI GitHub

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/federicoscimone/hometab

jobs:
  # ── Job 1: build immagine arm64 su runner GitHub e push su ghcr.io ──────────
  build:
    name: Build & Push (arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (emulazione arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push immagine
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 2: deploy sul Raspberry Pi via self-hosted runner ───────────────────
  deploy:
    name: Deploy su Raspberry Pi
    runs-on: self-hosted
    needs: build
    environment: production

    steps:
      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull nuova immagine
        run: docker pull ${{ env.IMAGE_NAME }}:latest

      - name: Restart container
        working-directory: /home/hometab/hometab
        run: |
          docker compose up -d --remove-orphans
          docker image prune -f

      - name: Health check
        run: |
          sleep 10
          curl -sf http://localhost:3000 || (echo "Health check fallito" && exit 1)
