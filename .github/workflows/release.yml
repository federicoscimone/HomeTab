name: Release

# A version tag (vX.Y.Z, annotated, on a commit of main) promotes the images the CI already built
# for that commit: X.Y.Z and X.Y point to the same digests that are running in local production,
# nothing is rebuilt. Then a GitHub Release is published with the notes from CHANGELOG.md.
# Tags are created by hand after the release is approved (docs/releasing.md).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # main's history, to check that the tagged commit is on it
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          version="${TAG#v}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]] ||
            fail "$TAG is not vMAJOR.MINOR.PATCH[-pre]"
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.type)" == tag ]] ||
            fail "$TAG is a lightweight tag: use git tag -a"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || fail "$TAG is not on main"
          [[ "$(git show "$GITHUB_SHA:package.json" | jq -r .version)" == "$version" ]] ||
            fail "package.json at $TAG does not say $version"
          grep -q "^## \[$version\]" CHANGELOG.md || fail "CHANGELOG.md has no section for $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"

  images:
    name: Tag ${{ matrix.image }}
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [hometab-app, hometab-mongodb]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A tag pushed right after the commit: wait for the CI to publish its images (up to 30 min).
      - name: Wait for the images of the commit
        run: |
          for _ in $(seq 60); do
            docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1 && exit 0
            sleep 30
          done
          echo "::error::$IMAGE:$GITHUB_SHA not found: did the CI pass on this commit?"
          exit 1
      # X.Y.Z always; X.Y only for a final version (a release candidate does not move X.Y).
      - name: Add the version tags
        run: |
          tags=(-t "$IMAGE:$VERSION")
          [[ "$VERSION" != *-* ]] && tags+=(-t "$IMAGE:${VERSION%.*}")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

  github-release:
    name: GitHub Release
    needs: [check, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the only job that can write: it creates the release
    steps:
      - uses: actions/checkout@v7
      - name: Publish the release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          # The section of this version: from its heading to the next one, without the link references.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found && !/^\[[^]]+\]: /
          ' CHANGELOG.md >"$RUNNER_TEMP/notes.md"
          flags=()
          [[ "$PRERELEASE" == true ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
