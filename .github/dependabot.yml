version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # One pull request for all minor and patch updates, one per major.
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # xlsx comes from the SheetJS CDN, not from npm: Dependabot would propose the stale 0.18.5.
      - dependency-name: xlsx
      # typescript-eslint (through eslint-config-next) does not support TypeScript 7 yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
