<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="192" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="192" height="192" rx="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="192" height="96" rx="38" fill="url(#shine)" clip-path="url(#round)"/>

  <!-- Roof (white triangle) -->
  <polygon points="96,44 155,102 37,102" fill="white"/>

  <!-- Body (white rectangle) -->
  <rect x="44" y="100" width="104" height="56" fill="white"/>

  <!-- Door — shows gradient through the white -->
  <rect x="82" y="118" width="28" height="38" rx="5" fill="url(#bg)"/>

  <!-- Bar chart LEFT of door (3 bars, ascending left→right, bottom-aligned at y=152) -->
  <rect x="51"  y="140" width="9" height="12" rx="2.5" fill="url(#bg)"/>
  <rect x="62"  y="133" width="9" height="19" rx="2.5" fill="url(#bg)"/>
  <rect x="73"  y="126" width="7" height="26" rx="2.5" fill="url(#bg)"/>

  <!-- Bar chart RIGHT of door (mirror: descending left→right) -->
  <rect x="112" y="126" width="7" height="26" rx="2.5" fill="url(#bg)"/>
  <rect x="121" y="133" width="9" height="19" rx="2.5" fill="url(#bg)"/>
  <rect x="132" y="140" width="9" height="12" rx="2.5" fill="url(#bg)"/>
</svg>
