<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Subtle top shine -->
  <rect width="512" height="256" rx="100" fill="url(#shine)" clip-path="url(#round)"/>

  <!-- Roof (white triangle) -->
  <polygon points="256,118 414,272 98,272" fill="white"/>

  <!-- Body (white rectangle) -->
  <rect x="118" y="266" width="276" height="150" fill="white"/>

  <!-- Door — shows gradient through the white -->
  <rect x="218" y="314" width="76" height="102" rx="13" fill="url(#bg)"/>

  <!-- Bar chart LEFT of door (3 bars, ascending left→right, bottom-aligned y=406) -->
  <rect x="136"  y="373" width="24" height="33"  rx="7" fill="url(#bg)"/>
  <rect x="165"  y="355" width="24" height="51"  rx="7" fill="url(#bg)"/>
  <rect x="194"  y="336" width="20" height="70"  rx="7" fill="url(#bg)"/>

  <!-- Bar chart RIGHT of door (mirror) -->
  <rect x="298"  y="336" width="20" height="70"  rx="7" fill="url(#bg)"/>
  <rect x="323"  y="355" width="24" height="51"  rx="7" fill="url(#bg)"/>
  <rect x="352"  y="373" width="24" height="33"  rx="7" fill="url(#bg)"/>
</svg>
